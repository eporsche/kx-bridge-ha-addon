# Ingress-Proxy für Home Assistant.
# Die Bridge-UI verwendet absolute Pfade (/kx/..., /api/...) und bei mehreren
# Druckern absolute URLs auf andere Ports. Dieser Proxy hängt den Ingress-Pfad
# davor und macht die Instanzen 7125-7130 unter <ingress>/_p/<port>/ erreichbar.
worker_processes 1;
pid /run/kx-ingress-nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_max_body_size 0;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Pfad hinter /_p/<port>, unverändert (inklusive Kodierung und Query-String).
    map $request_uri $kx_uri {
        ~^/_p/\d+(?<kx_rest>/.*)$ $kx_rest;
        default                   /;
    }

    # Kamera-Stream: Die Bridge startet ffmpeg erst bei der ersten Anfrage und
    # antwortet mit 503, wenn nach 5 s noch kein Bild da ist. Die UI versucht es
    # danach nicht erneut. Jeder server-Eintrag ist ein weiterer Versuch an
    # derselben Instanz (max_fails=0: ein 503 sperrt den Eintrag nicht).
    upstream kx_cam_7125 {
        server 127.0.0.1:7125 max_fails=0;
        server 127.0.0.1:7125 max_fails=0;
        server 127.0.0.1:7125 max_fails=0;
        server 127.0.0.1:7125 max_fails=0;
    }
    upstream kx_cam_7126 {
        server 127.0.0.1:7126 max_fails=0;
        server 127.0.0.1:7126 max_fails=0;
        server 127.0.0.1:7126 max_fails=0;
        server 127.0.0.1:7126 max_fails=0;
    }
    upstream kx_cam_7127 {
        server 127.0.0.1:7127 max_fails=0;
        server 127.0.0.1:7127 max_fails=0;
        server 127.0.0.1:7127 max_fails=0;
        server 127.0.0.1:7127 max_fails=0;
    }
    upstream kx_cam_7128 {
        server 127.0.0.1:7128 max_fails=0;
        server 127.0.0.1:7128 max_fails=0;
        server 127.0.0.1:7128 max_fails=0;
        server 127.0.0.1:7128 max_fails=0;
    }
    upstream kx_cam_7129 {
        server 127.0.0.1:7129 max_fails=0;
        server 127.0.0.1:7129 max_fails=0;
        server 127.0.0.1:7129 max_fails=0;
        server 127.0.0.1:7129 max_fails=0;
    }
    upstream kx_cam_7130 {
        server 127.0.0.1:7130 max_fails=0;
        server 127.0.0.1:7130 max_fails=0;
        server 127.0.0.1:7130 max_fails=0;
        server 127.0.0.1:7130 max_fails=0;
    }

    server {
        listen 8099;

        # Nur der Home-Assistant-Supervisor darf den Ingress-Port ansprechen.
        allow 172.30.32.2;
        deny all;

        set $kx_port 7125;
        set $kx_prefix $http_x_ingress_path;

        location = /_addon/ingress-shim.js {
            alias /opt/kx-ingress/ingress-shim.js;
            default_type application/javascript;
            add_header Cache-Control "no-cache";
        }

        location = /api/camera/stream {
            proxy_pass http://kx_cam_7125;
            include /opt/kx-ingress/proxy.conf;
            proxy_next_upstream error timeout http_503;
        }

        # Muss vor dem allgemeinen /_p/-Block stehen (erster Regex-Treffer gewinnt).
        location ~ ^/_p/(712[5-9]|7130)/api/camera/stream$ {
            set $kx_port $1;
            set $kx_prefix $http_x_ingress_path/_p/$1;
            proxy_pass http://kx_cam_$kx_port$kx_uri;
            include /opt/kx-ingress/proxy.conf;
            proxy_next_upstream error timeout http_503;
        }

        # Weitere Drucker-Instanzen: <ingress>/_p/<port>/...
        location ~ ^/_p/(712[5-9]|7130)(/.*)?$ {
            set $kx_port $1;
            set $kx_prefix $http_x_ingress_path/_p/$1;
            proxy_pass http://127.0.0.1:$kx_port$kx_uri;
            include /opt/kx-ingress/proxy.conf;
        }

        location / {
            proxy_pass http://127.0.0.1:7125;
            include /opt/kx-ingress/proxy.conf;
        }
    }
}
