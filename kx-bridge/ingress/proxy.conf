proxy_http_version 1.1;

# Fester Host-Name: Die Bridge baut daraus bei mehreren Druckern die bridge_url
# (http://kx-bridge.ingress:<port>), die der Shim im Browser wieder auf den
# Ingress-Pfad abbildet.
proxy_set_header Host kx-bridge.ingress:$kx_port;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# sub_filter braucht unkomprimierte Antworten.
proxy_set_header Accept-Encoding "";

# Log-Stream (SSE), Kamera (MJPEG) und große G-Code-Uploads nicht puffern.
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

proxy_redirect ~^https?://kx-bridge\.ingress:(\d+)(/.*)?$ $http_x_ingress_path/_p/$1$2;
proxy_redirect / $kx_prefix/;

sub_filter_once off;
sub_filter_types application/javascript text/javascript;
# Shim vor allen anderen Skripten laden.
sub_filter '<head>' '<head><script>window.__kxIngress={root:"$http_x_ingress_path",base:"$kx_prefix"};</script><script src="$http_x_ingress_path/_addon/ingress-shim.js"></script>';
# Ressourcen, die der Parser lädt, bevor ein Skript eingreifen kann.
sub_filter 'src="/' 'src="$kx_prefix/';
sub_filter 'href="/' 'href="$kx_prefix/';
# location lässt sich im Browser nicht abfangen.
sub_filter "location.href='/" "location.href=window.__kxIngress.base+'/";
